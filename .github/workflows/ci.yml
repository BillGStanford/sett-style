name: SETT CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Type Check & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sett-db-test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: DiskCart5
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python scripts/migrate.py
        env:
          DATABASE_URL: postgresql://postgres:DiskCart5@localhost:5432/sett-db-test

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          DATABASE_URL: postgresql://postgres:DiskCart5@localhost:5432/sett-db-test
          SECRET_KEY: test-secret-key-not-for-production
          ENVIRONMENT: test

  # ── Deploy ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy API to Railway
        run: echo "TODO: Add Railway deploy action"
        # Future: uses: railwayapp/railway-action@v1

      - name: Deploy Frontend to Vercel
        run: echo "TODO: Add Vercel deploy action"
